      <path d="M238 113 L244 117 L238 121" fill="none" stroke="#172554" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M260 113 L254 117 L260 121" fill="none" stroke="#172554" stroke-width="2.4" stroke-linecap="round"/>
    
